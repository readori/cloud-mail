name: Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy mode'
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - deploy-and-migrate

permissions:
  contents: read

jobs:
  deploy:
    name: CloudMail full-stack deployment
    uses: ./.github/workflows/_deploy-cloudflare.yml
    with:
      source: full-stack
      initialize_database: ${{ inputs.mode == 'deploy-and-migrate' }}
    secrets: inherit
