name: StoreKit Production QA

on:
  workflow_dispatch:

jobs:
  storekit-qa:
    name: Xcode 26.3 StoreKitTest
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 26.3
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_26.3.app/Contents/Developer"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "Xcode 26.3 is required but was not found at $XCODE_PATH" >&2
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Validate StoreKit QA contract
        run: python3 mail-ios/scripts/test_storekit_qa_contract.py

      - name: Run StoreKitTest suite
        env:
          STOREKIT_QA_RESULT_BUNDLE: ${{ runner.temp }}/CFMailStoreKitQA.xcresult
        run: mail-ios/scripts/ci_storekit_tests.sh

      - name: Upload StoreKit xcresult
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CFMail-StoreKit-QA-xcresult
          path: ${{ runner.temp }}/CFMailStoreKitQA.xcresult
          if-no-files-found: warn
          retention-days: 14
