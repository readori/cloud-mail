name: Deploy CF Mail Push Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfmail-push-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUSH_GATEWAY_D1_DATABASE_ID: ${{ secrets.PUSH_GATEWAY_D1_DATABASE_ID || vars.PUSH_GATEWAY_D1_DATABASE_ID }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install --global pnpm@9.15.9

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUSH_GATEWAY_D1_DATABASE_ID APNS_KEY_ID APNS_TEAM_ID APNS_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 78; }
          done
          [[ "$APNS_PRIVATE_KEY" == *"BEGIN PRIVATE KEY"* ]] || {
            echo '::error::APNS_PRIVATE_KEY does not look like an Apple .p8 key'
            exit 64
          }

      - name: Install and check
        working-directory: cfmail-push-gateway
        run: |
          pnpm install --frozen-lockfile=false
          pnpm test

      - name: Render CI config and secrets
        working-directory: cfmail-push-gateway
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from pathlib import Path

          text = Path('wrangler.toml').read_text(encoding='utf-8')
          text = text.replace('REPLACE_WITH_D1_DATABASE_ID', os.environ['PUSH_GATEWAY_D1_DATABASE_ID'])
          Path('wrangler-ci.toml').write_text(text, encoding='utf-8')
          Path('.wrangler-ci-secrets.json').write_text(json.dumps({
              'APNS_KEY_ID': os.environ['APNS_KEY_ID'],
              'APNS_TEAM_ID': os.environ['APNS_TEAM_ID'],
              'APNS_PRIVATE_KEY': os.environ['APNS_PRIVATE_KEY'],
          }), encoding='utf-8')
          PY

      - name: Ensure retry queues
        working-directory: cfmail-push-gateway
        shell: bash
        run: |
          set -euo pipefail
          pnpm wrangler queues info cfmail-apns-retry >/dev/null 2>&1 || pnpm wrangler queues create cfmail-apns-retry
          pnpm wrangler queues info cfmail-apns-dead-letter >/dev/null 2>&1 || pnpm wrangler queues create cfmail-apns-dead-letter

      - name: Apply D1 migrations
        working-directory: cfmail-push-gateway
        run: pnpm wrangler d1 migrations apply cfmail-push-gateway --remote --config wrangler-ci.toml

      - name: Deploy Gateway
        working-directory: cfmail-push-gateway
        run: pnpm wrangler deploy --config wrangler-ci.toml --secrets-file .wrangler-ci-secrets.json

      - name: Remove temporary secrets
        if: always()
        working-directory: cfmail-push-gateway
        run: rm -f .wrangler-ci-secrets.json wrangler-ci.toml
